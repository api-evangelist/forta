- aid: forta:forta-graphql-api
  name: Forta GraphQL API
  description: >-
    The Forta GraphQL API exposes the network's alerts and blockchain project
    threat-intelligence data. A single GraphQL endpoint accepts POST queries
    authenticated with a Bearer API key; the primary root query is `alerts`,
    with Relay-style cursor pagination (pageInfo/endCursor/hasNextPage). Paid
    plan and API key required.
