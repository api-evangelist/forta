aid: forta
name: Forta
description: >-
  Forta is a decentralized, real-time detection network for monitoring the
  security and operational health of Web3 systems. Spun out of OpenZeppelin and
  backed by a16z crypto, Forta runs thousands of community-built detection bots
  across independent scan nodes that inspect every transaction and block on
  chains such as Ethereum, Polygon, BNB Chain, Avalanche, Arbitrum and Optimism,
  emitting alerts that DeFi protocols and security teams subscribe to via email,
  Slack, Telegram, Discord and webhooks. Developers query alerts and threat
  intelligence through a GraphQL API, build and deploy detection bots with the
  Forta Bot SDK and CLI (JavaScript/TypeScript and Python), and the Forta
  Firewall product uses the Forta Chain (a Layer 3 network) to block
  smart-contract exploits before they execute.
