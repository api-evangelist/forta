  exposes an Apollo GraphQL Sandbox so developers can compose and run `alerts`
  queries against the schema interactively before wiring them into code. Bot
  developers also get a full local sandbox: the Bot SDK CLI runs bots locally
  against live or replayed block/transaction data.
